<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Primordis — a GPU particle-life simulator (Flutter Web + macOS).">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Primordis">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Primordis</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Compositing / stacking context (PRIMORDIS-ADR-005 / PRIMORDIS-TASK-005).

    The simulation runs on a sibling <canvas id="primordis-gpu-canvas"> the app
    owns and injects from Dart (web_canvas_compositor.dart) — NOT an
    HtmlElementView. It is positioned BEHIND Flutter's view; Flutter renders as a
    transparent glass-pane so the simulation shows through every empty/background
    region while the controls overlay on top.

    - body background is black so letterbox margins (the contain-fit bars around
      the 1080x720 world) read as the simulation's near-black field, not white.
    - the GPU canvas sits at z-index 0; the Flutter host is lifted above it and
      made transparent so it composites over the canvas rather than hiding it.
  -->
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    /* The Dart compositor also sets these inline; declared here so the canvas is
       correctly stacked/non-interactive even for the first frame before sync. */
    #primordis-gpu-canvas {
      position: fixed;
      z-index: 0;
      pointer-events: none;
      display: block;
    }
    /* Lift the Flutter view above the GPU canvas and keep its background clear so
       the glass-pane composites over the simulation. */
    flutter-view, flt-glass-pane {
      position: relative;
      z-index: 1;
      background: transparent;
    }
  </style>
</head>
<body>
  <!--
    WebGPU canvas anchor (PRIMORDIS-ADR-005 / PRIMORDIS-TASK-005):
    The simulation runs on a <canvas> we own, NOT inside an HtmlElementView.
    TASK-005 injects that canvas as a sibling element positioned BEHIND
    Flutter's transparent glass-pane (e.g. id="primordis-gpu-canvas", absolutely
    positioned, z-index below flutter-view). It is intentionally not created
    here — this comment reserves the documented insertion point.
  -->

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
